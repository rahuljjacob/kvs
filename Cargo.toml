[package]
name = "kvs"
version = "0.1.0"
description = "A key-value store"
authors = ["Rahul Jacob <rahuljjacob@gmail.com>"]
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
failure = "0.1.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
slog = "2.8.2"
slog-term = "2.9.2"
slog-async = "2.8.0"
sled = "0.34.7"
crossbeam-channel = "0.5.16"

[dev-dependencies]
assert_cmd = "0.11"
criterion = "0.2.11"
crossbeam-utils = "0.6.5"
predicates = "1.0.0"
rand = "0.6.5"
tempfile = "3.0.7"
walkdir = "2.2.7"
panic-control = "0.1.4"

[[bench]]
name = "benches"
harness = false
